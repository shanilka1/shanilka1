<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgIct" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gradIct" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
  </defs>
  <rect width="596" height="236" x="2" y="2" rx="16" fill="url(#bgIct)" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <g transform="translate(30, 30)">
    <rect width="48" height="48" rx="12" fill="#C084FC" fill-opacity="0.15" stroke="#C084FC" stroke-width="1.5"/>
    <text x="24" y="32" font-size="24" text-anchor="middle">👨‍🏫</text>
    
    <text x="65" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">MyICT &amp; Online Education Portal</text>
    <text x="65" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="url(#gradIct)">E-LEARNING &amp; CLASS PAYMENT PLATFORM</text>
    
    <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="0" dy="0">Specialized learning portal built for Grade 6–11 ICT students</tspan>
      <tspan x="0" dy="20">featuring lesson resources, practice quizzes, enrollment workflows,</tspan>
      <tspan x="0" dy="20">and online fee payment slips integration.</tspan>
