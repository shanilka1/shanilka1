      <rect x="73" width="75" height="26" rx="6" fill="#F472B6" fill-opacity="0.15" stroke="#F472B6" stroke-width="1"/>
      <text x="110" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#F472B6" text-anchor="middle">EdTech</text>
      
      <rect x="156" width="75" height="26" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
      <text x="193" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#60A5FA" text-anchor="middle">Payment</text>

      <rect x="239" width="65" height="26" rx="6" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-width="1"/>
