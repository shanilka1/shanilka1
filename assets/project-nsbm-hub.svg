<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgNsbm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gradNsbm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <rect width="596" height="236" x="2" y="2" rx="16" fill="url(#bgNsbm)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <g transform="translate(30, 30)">
    <rect width="48" height="48" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
    <text x="24" y="32" font-size="24" text-anchor="middle">🏛️</text>
    
    <text x="65" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">NSBM Student Hub</text>
    <text x="65" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="url(#gradNsbm)">ACADEMIC &amp; CAMPUS MANAGEMENT PORTAL</text>
    
    <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="0" dy="0">Central portal for university students to track modules, manage</tspan>
      <tspan x="0" dy="20">academic submissions, access resources, and view campus announcements</tspan>
      <tspan x="0" dy="20">with secure authentication.</tspan>
    </text>
    
    <g transform="translate(0, 150)">
      <rect width="60" height="26" rx="6" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
      <text x="30" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#F87171" text-anchor="middle">Java</text>
      
      <rect x="68" width="90" height="26" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <text x="113" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">Spring Boot</text>
      
      <rect x="166" width="65" height="26" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
      <text x="198" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#60A5FA" text-anchor="middle">MySQL</text>

      <rect x="239" width="75" height="26" rx="6" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1"/>
      <text x="276" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#818CF8" text-anchor="middle">OOP / MVC</text>
    </g>
