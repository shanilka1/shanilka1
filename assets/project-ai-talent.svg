<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="gradAi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>
  <rect width="596" height="236" x="2" y="2" rx="16" fill="url(#bgAi)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <g transform="translate(30, 30)">
    <!-- Icon -->
    <rect width="48" height="48" rx="12" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="24" y="32" font-size="24" text-anchor="middle">🤖</text>
    
    <!-- Title & Status -->
    <text x="65" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">AI Talent Hub</text>
    <text x="65" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="url(#gradAi)">SMART AI RECRUITMENT &amp; RESUME PLATFORM</text>
    
    <!-- Description -->
    <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="0" dy="0">Intelligent recruitment ecosystem that helps candidates build optimized</tspan>
      <tspan x="0" dy="20">resumes, discover relevant jobs, and empowers recruiters to match</tspan>
      <tspan x="0" dy="20">ideal talent using AI algorithms.</tspan>
    </text>
    
    <!-- Tech Stack Badges -->
    <g transform="translate(0, 150)">
      <rect width="55" height="26" rx="6" fill="#9333EA" fill-opacity="0.15" stroke="#9333EA" stroke-width="1"/>
      <text x="27.5" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#C084FC" text-anchor="middle">C#</text>
      
      <rect x="63" width="65" height="26" rx="6" fill="#512BD4" fill-opacity="0.2" stroke="#818CF8" stroke-width="1"/>
      <text x="95.5" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#818CF8" text-anchor="middle">.NET</text>
      
      <rect x="136" width="75" height="26" rx="6" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
      <text x="173.5" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">AI / NLP</text>

      <rect x="219" width="80" height="26" rx="6" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-width="1"/>
      <text x="259" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">Full Stack</text>
    </g>
  </g>
</svg>
