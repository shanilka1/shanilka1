<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgLaundry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gradLaundry" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <rect width="596" height="236" x="2" y="2" rx="16" fill="url(#bgLaundry)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <g transform="translate(30, 30)">
    <rect width="48" height="48" rx="12" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="24" y="32" font-size="24" text-anchor="middle">🧺</text>
    
    <text x="65" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Pick &amp; Press — Laundry System</text>
    <text x="65" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="url(#gradLaundry)">PICKUP &amp; DELIVERY ENTERPRISE SYSTEM</text>
    
    <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="0" dy="0">Complete management platform for on-demand laundry orders,</tspan>
      <tspan x="0" dy="20">driver pickup scheduling, washing &amp; ironing tracking, automated billing,</tspan>
      <tspan x="0" dy="20">and end-to-end customer notifications.</tspan>
    </text>
    
    <g transform="translate(0, 150)">
      <rect width="85" height="26" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
      <text x="42" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FBBF24" text-anchor="middle">JavaScript</text>
      
      <rect x="93" width="75" height="26" rx="6" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1"/>
      <text x="130" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#06B6D4" text-anchor="middle">Express.js</text>
      
      <rect x="176" width="65" height="26" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
      <text x="208" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#60A5FA" text-anchor="middle">MySQL</text>

      <rect x="249" width="80" height="26" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <text x="289" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">REST APIs</text>
    </g>
  </g>
