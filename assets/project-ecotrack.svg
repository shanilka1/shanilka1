<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgEco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gradEco" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>
  <rect width="596" height="236" x="2" y="2" rx="16" fill="url(#bgEco)" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <g transform="translate(30, 30)">
    <rect width="48" height="48" rx="12" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E" stroke-width="1.5"/>
    <text x="24" y="32" font-size="24" text-anchor="middle">🌿</text>
    
    <text x="65" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">EcoTrack</text>
    <text x="65" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="url(#gradEco)">ENVIRONMENTAL IMPACT &amp; HABIT TRACKER</text>
    
    <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="0" dy="0">Cross-platform mobile application empowering users to monitor carbon</tspan>
      <tspan x="0" dy="20">footprints, build eco-friendly daily habits, and earn sustainability</tspan>
      <tspan x="0" dy="20">milestones through gamification.</tspan>
    </text>
    
    <g transform="translate(0, 150)">
      <rect width="60" height="26" rx="6" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="1"/>
      <text x="30" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">Dart</text>
      
      <rect x="68" width="65" height="26" rx="6" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1"/>
      <text x="100" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#22D3EE" text-anchor="middle">Flutter</text>
      
      <rect x="141" width="75" height="26" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
      <text x="178" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FBBF24" text-anchor="middle">Firebase</text>

      <rect x="224" width="75" height="26" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <text x="261" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">Mobile</text>
    </g>
  </g>
